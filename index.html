<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Khoasoma SSH portfolio — query profile, projects and experience directly from the terminal.">
  <meta name="author" content="Khoasoma">
  <meta name="theme-color" content="#151614">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Khoasoma — SSH Portfolio">
  <meta property="og:description" content="An interactive command-line portfolio for a backend and infrastructure engineer.">
  <meta property="og:image" content="https://khoasoma.github.io/assets/portrait-khoa.png">
  <meta property="og:url" content="https://khoasoma.github.io/">
  <link rel="canonical" href="https://khoasoma.github.io/">
  <link rel="alternate" hreflang="en" href="https://khoasoma.github.io/">
  <title>Khoasoma — SSH Portfolio</title>
  <link rel="icon" href="./assets/kaoruko-waguri-waguri-kaoruko.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Manrope:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./portfolio.css?v=ssh4">
  <script src="./portfolio.js?v=ssh5" defer></script>
</head>
<body>
  <main class="shell-client" aria-label="Khoasoma SSH portfolio">
    <h1 class="visually-hidden">Khoasoma SSH Portfolio</h1>
    <header class="client-bar">
      <div class="window-controls" aria-hidden="true">
        <span></span><span></span><span></span>
      </div>
      <div class="session-title">
        <span class="session-icon" aria-hidden="true">KS</span>
        <div>
          <strong>portfolio.khoasoma.dev</strong>
          <span>ssh / 22</span>
        </div>
      </div>
      <div class="connection-state">
        <span class="connection-dot" aria-hidden="true"></span>
        <span data-connection-label>connected</span>
      </div>
    </header>

    <section class="terminal" data-terminal aria-label="Interactive terminal">
      <div class="terminal-scroll" data-terminal-scroll>
        <div class="terminal-output" role="log" aria-live="polite" aria-relevant="additions" data-output>
          <noscript>
            <p>JavaScript is required to run this command-line portfolio.</p>
          </noscript>
        </div>

        <form class="command-form" data-command-form autocomplete="off">
          <label class="visually-hidden" for="command-input">Enter command</label>
          <span class="prompt-user">guest@khoasoma</span><span class="prompt-path">:~$</span>
          <input
            id="command-input"
            name="command"
            type="text"
            inputmode="text"
            enterkeyhint="send"
            autocomplete="off"
            autocapitalize="none"
            spellcheck="false"
            data-command-input
            autofocus
          >
        </form>
      </div>
    </section>
  </main>
</body>
</html>
